; ESP32 MQTT control firmware - dual-core FreeRTOS state machines.
;
; framework = arduino, espidf (hybrid) is required, not just "arduino": the
; network task uses ESP-IDF's esp_mqtt_client directly (see src/network_task.cpp)
; because the common Arduino MQTT library (PubSubClient) does not implement
; real QoS 1 delivery (broker acks + resend) - esp_mqtt_client does.
;
; First build note: the hybrid framework generates an sdkconfig on first
; `pio run`. If the build fails with "mqtt_client.h: No such file", run
; `pio run -t menuconfig` and confirm Component config -> ESP-IDF MQTT is
; enabled (it is by default in recent arduino-esp32/espressif32 platform
; releases, but older ones may need it turned on manually).
[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino, espidf
monitor_speed = 115200
upload_port = COM3
monitor_port = COM3
; OTA (both the GitHub-pull mechanism in src/ota_update.cpp and the espota
; env below) needs an ota_0/ota_1/otadata partition layout - the board's
; default single-"factory" table has no second slot to write a new image
; into. See partitions_ota.csv for the layout and sizing rationale.
board_build.partitions = partitions_ota.csv
lib_deps =
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3

; Wireless upload once the board is sealed up and USB isn't reachable.
; Usage: pio run -e esp32doit-devkit-v1-ota -t upload --upload-port <board-ip>
[env:esp32doit-devkit-v1-ota]
extends = env:esp32doit-devkit-v1
upload_protocol = espota
upload_flags =
    --auth=CHANGE_ME_OTA_PASSWORD
    --timeout=60
upload_port = 0.0.0.0
